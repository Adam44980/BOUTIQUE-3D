<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Forge3D — Administration Back-Office</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

    <div id="login-modal" class="fixed inset-0 bg-slate-950 flex items-center justify-center z-50">
        <form onsubmit="loginAdmin(event)" class="bg-slate-900 border border-slate-800 p-8 rounded-2xl max-w-sm w-full space-y-4">
            <h2 class="text-xl font-black text-center text-cyan-400"><i class="fa-solid fa-lock"></i> Connexion Back-Office</h2>
            <input type="text" id="admin-user" placeholder="Nom d'utilisateur" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs outline-none">
            <input type="password" id="admin-pass" placeholder="Mot de passe" required class="w-full bg-slate-950 border border-slate-800 p-3 rounded-xl text-xs outline-none">
            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-3 rounded-xl transition">Connexion</button>
        </form>
    </div>

    <div id="admin-dashboard" class="hidden p-8 max-w-7xl mx-auto">
        <div class="flex justify-between items-center mb-8 border-b border-slate-800 pb-4">
            <h1 class="text-2xl font-black text-cyan-400"><i class="fa-solid fa-cube mr-2"></i>FORGE 3D — Tableau de Bord International</h1>
            <button onclick="logoutAdmin()" class="bg-red-500/10 text-red-400 px-4 py-2 rounded-xl text-xs border border-red-500/20">Déconnexion</button>
        </div>

        <h2 class="text-xl font-bold mb-4">Commandes & Bordereaux d'Expédition</h2>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-x-auto">
            <table class="w-full text-left text-xs">
                <thead class="bg-slate-950 text-slate-400 border-b border-slate-800">
                    <tr>
                        <th class="p-4">#ID</th>
                        <th class="p-4">Client</th>
                        <th class="p-4">Pays / Adresse</th>
                        <th class="p-4">Transporteur</th>
                        <th class="p-4">Total</th>
                        <th class="p-4">Statut</th>
                        <th class="p-4">Bordereau PDF</th>
                    </tr>
                </thead>
                <tbody id="orders-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function checkAdmin() {
            const res = await fetch('/api/admin/check');
            const data = await res.json();
            if (data.isAdmin) {
                document.getElementById('login-modal').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                loadOrders();
            }
        }

        async function loginAdmin(e) {
            e.preventDefault();
            const res = await fetch('/api/admin/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('admin-user').value,
                    password: document.getElementById('admin-pass').value
                })
            });
            const data = await res.json();
            if (data.success) checkAdmin();
        }

        async function logoutAdmin() {
            await fetch('/api/admin/logout', { method: 'POST' });
            window.location.reload();
        }

        async function loadOrders() {
            const res = await fetch('/api/admin/orders');
            const orders = await res.json();
            document.getElementById('orders-list').innerHTML = orders.map(o => `
                <tr class="border-b border-slate-800 hover:bg-slate-950/50">
                    <td class="p-4 font-bold">#${o.id}</td>
                    <td class="p-4"><b>${o.customer_name}</b><br><span class="text-slate-500">${o.email}</span></td>
                    <td class="p-4">${o.address} (${o.country})</td>
                    <td class="p-4 font-semibold text-cyan-400">${o.carrier}</td>
                    <td class="p-4 font-bold">${o.total.toFixed(2)} €</td>
                    <td class="p-4"><span class="bg-cyan-500/10 text-cyan-400 px-2 py-1 rounded border border-cyan-500/20">${o.status}</span></td>
                    <td class="p-4">
                        <button onclick="alert('Impression du bordereau N° ${o.tracking_number || 'EN_COURS'}')" class="bg-slate-800 hover:bg-slate-700 text-xs px-3 py-1.5 rounded border border-slate-700">
                            <i class="fa-solid fa-print mr-1"></i> Bordereau
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        checkAdmin();
    </script>
</body>
</html>
