<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forge3D — International 3D Print & Gaming Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black text-cyan-400 tracking-wider"><i class="fa-solid fa-cube mr-2"></i>FORGE 3D</h1>
            <button onclick="toggleCart()" class="bg-slate-800 p-2.5 rounded-xl border border-slate-700 relative">
                <i class="fa-solid fa-cart-shopping text-cyan-400"></i>
                <span id="cart-count" class="absolute -top-2 -right-2 bg-cyan-500 text-slate-950 text-xs font-bold w-5 h-5 rounded-full flex items-center justify-center">0</span>
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-4 py-8 flex-1 w-full">
        <h2 class="text-2xl font-bold mb-6">Catalogue Accessoires Gaming & Pièces 3D</h2>
        <div id="product-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </main>

    <!-- Drawer Panier / Shipping International -->
    <div id="cart-drawer" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden flex justify-end z-50">
        <div class="w-full max-w-md bg-slate-900 p-6 flex flex-col justify-between h-full border-l border-slate-800 overflow-y-auto">
            <div>
                <div class="flex justify-between items-center mb-6">
                    <h3 class="font-bold text-lg"><i class="fa-solid fa-earth-americas text-cyan-400 mr-2"></i> Panier & Expédition</h3>
                    <button onclick="toggleCart()" class="text-slate-400"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                <div id="cart-items" class="space-y-3"></div>
            </div>

            <div class="border-t border-slate-800 pt-4 mt-6">
                <div class="flex justify-between text-xs mb-1"><span class="text-slate-400">Sous-total :</span><span id="subtotal">0.00 €</span></div>
                <div class="flex justify-between text-xs mb-3"><span class="text-slate-400">Frais de port :</span><span id="shipping-cost" class="text-cyan-400">4.90 €</span></div>
                <div class="flex justify-between font-bold text-base mb-4"><span>Total final :</span><span id="cart-total" class="text-cyan-400">4.90 €</span></div>

                <form onsubmit="startStripePayment(event)" class="space-y-3">
                    <input type="text" id="cust-name" placeholder="Nom Complet" required class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs outline-none focus:border-cyan-500">
                    <input type="email" id="cust-email" placeholder="Adresse Email" required class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs outline-none focus:border-cyan-500">
                    <input type="text" id="cust-address" placeholder="Adresse complète de livraison" required class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs outline-none focus:border-cyan-500">

                    <div class="grid grid-cols-2 gap-2">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Pays</label>
                            <select id="cust-country" onchange="updateShippingCost()" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs outline-none">
                                <option value="FR">France 🇫🇷</option>
                                <option value="BE">Belgique 🇧🇪</option>
                                <option value="CH">Suisse 🇨🇭</option>
                                <option value="DE">Allemagne 🇩🇪</option>
                                <option value="US">États-Unis 🇺🇸</option>
                                <option value="CA">Canada 🇨🇦</option>
                                <option value="WORLD">Reste du Monde 🌍</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Transporteur</label>
                            <select id="cust-carrier" onchange="updateShippingCost()" class="w-full bg-slate-950 border border-slate-800 p-2.5 rounded-lg text-xs outline-none">
                                <option value="MONDIAL_RELAY">Mondial Relay (Point Relais)</option>
                                <option value="COLISSIMO_FR">Colissimo Domicile</option>
                                <option value="DHL_EXPRESS">DHL Express International</option>
                                <option value="FEDEX_INT">FedEx International</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" id="pay-btn" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-black py-3 rounded-xl transition mt-2">
                        <i class="fa-solid fa-lock mr-2"></i> Payer par Carte / Apple Pay
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        const colors = ['Noir', 'Gris', 'Blanc', 'Bleu', 'Rouge', 'Jaune'];

        async function loadProducts() {
            const res = await fetch('/api/products');
            const products = await res.json();
            document.getElementById('product-grid').innerHTML = products.map(p => `
                <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col justify-between">
                    <div>
                        <img src="${p.image}" class="rounded-lg h-44 w-full object-cover mb-3">
                        <h3 class="font-bold text-sm">${p.title}</h3>
                        <p class="text-xs text-slate-400 mt-1">${p.description}</p>
                        
                        <label class="block text-xs text-slate-400 mt-3 mb-1">Couleur Filament (PLA) :</label>
                        <select id="color-${p.id}" class="w-full bg-slate-950 border border-slate-800 p-2 rounded text-xs">
                            ${colors.map(c => `<option value="${c}">${c}</option>`).join('')}
                        </select>
                    </div>
                    <div class="mt-4 flex justify-between items-center border-t border-slate-800 pt-3">
                        <span class="text-lg font-bold text-cyan-400">${p.price.toFixed(2)} €</span>
                        <button onclick="addToCart('${p.title}', ${p.price}, ${p.id})" class="bg-cyan-500 text-slate-950 px-3 py-1.5 text-xs font-bold rounded-lg">+ Panier</button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart() { document.getElementById('cart-drawer').classList.toggle('hidden'); }

        function addToCart(title, price, id) {
            const color = document.getElementById(`color-${id}`).value;
            cart.push({ title, price, color });
            updateUI();
            toggleCart();
        }

        async function updateShippingCost() {
            const country = document.getElementById('cust-country').value;
            const carrier = document.getElementById('cust-carrier').value;
            
            const res = await fetch('/api/calculate-shipping', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ country, carrier })
            });
            const data = await res.json();
            
            document.getElementById('shipping-cost').innerText = data.cost.toFixed(2) + ' €';
            const subtotal = cart.reduce((a, b) => a + b.price, 0);
            document.getElementById('cart-total').innerText = (subtotal + data.cost).toFixed(2) + ' €';
        }

        function updateUI() {
            document.getElementById('cart-count').innerText = cart.length;
            const container = document.getElementById('cart-items');
            container.innerHTML = cart.map((item, idx) => `
                <div class="flex justify-between items-center bg-slate-950 p-3 rounded-lg border border-slate-800 text-xs">
                    <div><b>${item.title}</b> <span class="text-slate-500">(${item.color})</span><div class="text-cyan-400">${item.price.toFixed(2)} €</div></div>
                    <button onclick="cart.splice(${idx},1);updateUI();" class="text-slate-500"><i class="fa-solid fa-trash"></i></button>
                </div>
            `).join('');
            
            const subtotal = cart.reduce((a, b) => a + b.price, 0);
            document.getElementById('subtotal').innerText = subtotal.toFixed(2) + ' €';
            updateShippingCost();
        }

        async function startStripePayment(e) {
            e.preventDefault();
            if (cart.length === 0) return alert("Panier vide !");

            const response = await fetch('/api/create-checkout-session', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    items: cart,
                    customerEmail: document.getElementById('cust-email').value,
                    customerName: document.getElementById('cust-name').value,
                    address: document.getElementById('cust-address').value,
                    country: document.getElementById('cust-country').value,
                    carrier: document.getElementById('cust-carrier').value
                })
            });

            const data = await response.json();
            if (data.url) window.location.href = data.url;
        }

        loadProducts();
    </script>
</body>
</html>
